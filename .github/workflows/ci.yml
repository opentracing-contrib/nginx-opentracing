name: CI

on:
  push:
    branches:
      - master
    tags:
      - v[0-9]+.[0-9]+.[0-9]+
  pull_request:
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  release-notes:
    name: Create/Update release notes
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Create/Update Draft
        uses: lucacome/draft-release@v2.2.2
        with:
          minor-label: enhancement
          major-label: change
          publish: ${{ github.ref_type == 'tag' }}
          collapse-after: 50
        if: github.event_name != 'pull_request'

  build-binaries:
    name: Build Binaries
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: release-notes
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-26.04, ubuntu-26.04-arm]
        nginx_version:
          [
            1.21.6,
            1.22.1,
            1.23.4,
            1.24.0,
            1.25.5,
            1.26.3,
            1.27.5,
            1.28.3,
            1.29.8,
            1.30.0,
            1.30.1,
            1.30.2,
            1.30.3,
            1.30.4,
            1.30.5,
            1.30.6,
            1.31.0,
            1.31.1,
            1.31.2,
            1.31.3,
            1.31.4,
            1.31.5,
            1.31.6,
            1.31.7
          ]
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Get vars
        id: vars
        run: |
          if [ "$(uname -m)" = "x86_64" ]; then echo "arch=amd64" >> "$GITHUB_OUTPUT"; else echo "arch=arm64" >> "$GITHUB_OUTPUT"; fi

      - name: Build binary
        uses: docker/build-push-action@v7.4.0
        with:
          pull: true
          push: false
          file: build/Dockerfile
          tags: ${{ matrix.nginx_version }}
          cache-from: type=gha,scope=${{ matrix.nginx_version }}-${{ steps.vars.outputs.arch }}
          cache-to: type=gha,scope=${{ matrix.nginx_version }}-${{ steps.vars.outputs.arch }},mode=max
          provenance: mode=max
          sbom: true
          target: export
          build-args: NGINX_VERSION=${{ matrix.nginx_version }}
          outputs: type=local,dest=out

      - name: Compress output
        run: |
          tar -czf linux-${{ steps.vars.outputs.arch }}-nginx-${{ matrix.nginx_version }}-ngx_http_module.so.tgz -C out/ ngx_http_opentracing_module.so
          cp out/provenance.json linux-${{ steps.vars.outputs.arch }}-nginx-${{ matrix.nginx_version }}-ngx_http_module.so.provenance.json
          cp out/sbom.spdx.json linux-${{ steps.vars.outputs.arch }}-nginx-${{ matrix.nginx_version }}-ngx_http_module.so.sbom.spdx.json

      - name: Upload artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: nginx-opentracing-modules-${{ matrix.nginx_version }}-${{ steps.vars.outputs.arch }}
          path: linux-${{ steps.vars.outputs.arch }}-nginx-${{ matrix.nginx_version }}-ngx_http_module.so.*

  release-binaries:
    name: Upload Binaries on Release
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    needs: build-binaries
    if: github.ref_type == 'tag'
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          pattern: nginx-opentracing-modules-*
          path: dist
          merge-multiple: true

      - name: Upload binaries on release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          gh release upload "$REF_NAME" dist/* --clobber
