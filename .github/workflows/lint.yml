name: Lint

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

concurrency:
  group: ${{ github.ref_name }}-lint
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  checks:
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
      - name: Mise
        uses: jdx/mise-action@v5

      - name: Install dependencies
        run: |
          mise deps

      - name: Run lint
        run: |
          mise run lint --no-progress

  jactionlint:
    name: jactionlint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run jactionlint
        uses: jdx/jactionlint@v2.2.0

  markdown-lint:
    name: Markdown Lint
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          config: .markdownlint-cli2.yaml
          globs: '**/*.md'
          fix: false
