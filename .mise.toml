[tools]
"aqua:owenlamont/ryl" = "0.26.0"
"npm:knip" = "6.42.1"
"npm:sort-package-json" = "4.1.0"
"pipx:codespell" = "2.4.3"
"pipx:isort" = "9.0.2"
"pipx:psf/black" = "26.10.1"
"pipx:ruff" = "0.17.2"
betterleaks = "1.9.0"
clang-format = "23.1.4"
editorconfig-checker = "4.0.2"
hk = "2.8.1"
jactionlint = "2.3.0"
markdownlint-cli2 = "0.24.0"
pkl = "0.32.2"
typos = "1.51.1"
uv = "0.13.5"
yamllint = "1.38.0"

[tasks.lint]
alias = "l"
description = "Lint the codebase"
run = "hk check --all"

[tasks.format]
alias = "fmt"
description = "Format the codebase"
run = "hk fix --all"

[tasks.postlint]
description = "Run post-lint checks"
run = "git diff --exit-code"

[settings]
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[deps.pip]
auto = true
