[tools]
hk = "1.54.1"
pkl = "0.32.1"
actionlint = "1.7.12"
yamllint = "1.38.0"
markdownlint-cli2 = "0.23.2"
gitleaks = "8.30.1"
editorconfig-checker = "3.8.0"
uv = "0.12.3"
"pipx:isort" = "8.0.1"
"pipx:psf/black" = "26.5.1"
"pipx:codespell" = "2.4.3"
"pipx:ruff" = "0.16.1"

[tasks.lint]
alias = "l"
description = "Lint the codebase"
run = "hk check --all"

[tasks.format]
alias = "fmt"
description = "Format the codebase"
run = "hk fix --all"

[tasks.postlint]
description = "Run post-lint checks"
run = "git diff --exit-code"

[settings]
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[deps.pip]
auto = true
