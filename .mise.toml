[tools]
"aqua:owenlamont/ryl" = "0.30.0"
"npm:knip" = "6.48.0"
"npm:sort-package-json" = "4.1.0"
"pipx:codespell" = "2.4.3"
"pipx:isort" = "9.0.2"
"pipx:psf/black" = "26.10.1"
"pipx:ruff" = "0.17.6"
betterleaks = "1.10.1"
clang-format = "23.1.6"
editorconfig-checker = "4.0.2"
hk = "2.14.0"
jactionlint = "2.6.0"
markdownlint-cli2 = "0.24.2"
pkl = "0.33.1"
typos = "1.52.2"
uv = "0.13.10"
yamllint = "1.38.0"

[tasks.lint]
alias = "l"
description = "Lint the codebase"
run = "hk check --all"

[tasks.format]
alias = "fmt"
description = "Format the codebase"
run = "hk fix --all"

[tasks.postlint]
description = "Run post-lint checks"
run = "git diff --exit-code"

[settings]
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[deps.pip]
auto = true
