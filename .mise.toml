[tools]
"github:kjanat/actionlint" = "1.17.0"
"pipx:codespell" = "2.4.3"
"pipx:isort" = "9.0.2"
"pipx:psf/black" = "26.5.1"
"pipx:ruff" = "0.16.10"
betterleaks = "1.8.1"
clang-format = "23.1.2"
editorconfig-checker = "4.0.2"
hk = "2.4.0"
markdownlint-cli2 = "0.23.3"
pkl = "0.32.1"
uv = "0.12.23"
yamllint = "1.38.0"

[tasks.lint]
alias = "l"
description = "Lint the codebase"
run = "hk check --all"

[tasks.format]
alias = "fmt"
description = "Format the codebase"
run = "hk fix --all"

[tasks.postlint]
description = "Run post-lint checks"
run = "git diff --exit-code"

[settings]
idiomatic_version_file_enable_tools = ["python"]
experimental = true

[deps.pip]
auto = true
